apiVersion: apps/v1
kind: Deployment
metadata:
    name: backend
spec:
    replicas: 1
    selector:
        matchLabels:
            app: backend
    template:
        metadata:
            labels:
                app: backend
        spec:
            containers:
                - name: backend
                  image: 8vladpavliuk8/diploma-backend:latest
                  ports:
                      - containerPort: 5000
                  readinessProbe:
                      httpGet:
                          path: /api/health
                          port: 5000
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /api/health
                          port: 5000
                      initialDelaySeconds: 10
                      periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
    name: backend
spec:
    selector:
        app: backend
    ports:
        - port: 5000
          targetPort: 5000
