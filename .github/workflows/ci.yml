name: CI - Build and Push Docker Images

on:
    push:
        branches: ['main']

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build backend image
              run: |
                  docker build -t ${{ secrets.DOCKER_USERNAME }}/diploma-backend:latest ./backend

            - name: Push backend image
              run: |
                  docker push ${{ secrets.DOCKER_USERNAME }}/diploma-backend:latest

            - name: Build frontend image
              run: |
                  docker build -t ${{ secrets.DOCKER_USERNAME }}/diploma-frontend:latest ./frontend

            - name: Push frontend image
              run: |
                  docker push ${{ secrets.DOCKER_USERNAME }}/diploma-frontend:latest
