name: CI - Build, Push and Update Kubernetes Manifests

on:
    push:
        branches: ['main']

permissions:
    contents: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set image tag
              run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build backend image
              run: |
                  docker build -t ${{ secrets.DOCKER_USERNAME }}/diploma-backend:${IMAGE_TAG} ./backend

            - name: Push backend image
              run: |
                  docker push ${{ secrets.DOCKER_USERNAME }}/diploma-backend:${IMAGE_TAG}

            - name: Build frontend image
              run: |
                  docker build -t ${{ secrets.DOCKER_USERNAME }}/diploma-frontend:${IMAGE_TAG} ./frontend

            - name: Push frontend image
              run: |
                  docker push ${{ secrets.DOCKER_USERNAME }}/diploma-frontend:${IMAGE_TAG}

            - name: Update Kubernetes manifests
              run: |
                  sed -i "s|image: .*/diploma-backend:.*|image: ${{ secrets.DOCKER_USERNAME }}/diploma-backend:${IMAGE_TAG}|g" k8s/backend.yaml
                  sed -i "s|image: .*/diploma-frontend:.*|image: ${{ secrets.DOCKER_USERNAME }}/diploma-frontend:${IMAGE_TAG}|g" k8s/frontend.yaml

            - name: Commit updated manifests
              run: |
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"
                  git add k8s/backend.yaml k8s/frontend.yaml
                  git commit -m "Update image tags to ${IMAGE_TAG}" || echo "No changes to commit"
                  git push
