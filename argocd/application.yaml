apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: diploma-app
    namespace: argocd
spec:
    project: default

    source:
        repoURL: https://github.com/vlad-pavliuk-ops/diploma-devops-project.git
        targetRevision: main
        path: k8s

    destination:
        server: https://kubernetes.default.svc
        namespace: diploma

    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
